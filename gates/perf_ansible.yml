---
# Runs the perf gate's cells (gates/perf.ts) on the minis with the fleet key,
# so no personal key has to live on the Macs. Driven from the laptop by
# gates/perf_ansible.ts, which leaves in ~/bend-perf/ on the bastion this
# file, jobs.json (the hosts) and nodes/<host>.tar (the node's <host>.sh and
# the packs it builds from), and reads back ~/bend-perf/out/out.json (each
# host's output).
#
# Every node runs its job at once and prints its output, which comes back in
# the async result: no fetch, and the job removes its own work dir. The
# timing happens on the node (a perl clock and /usr/bin/time -l, as in the
# gate), so the bastion's pace never reaches the numbers.
#
#   cd ~/ansible && sudo ANSIBLE_PIPELINING=1 ansible-playbook \
#     ~/bend-perf/perf_ansible.yml -e @$HOME/bend-perf/jobs.json

- name: Run the bend perf cells
  hosts: "{{ jobs }}"
  gather_facts: false
  vars:
    bundle: "{{ playbook_dir }}"
    work: /Users/HigherOrderCompany/bend-perf-run
  tasks:
    - name: Copy the node's bundle
      ansible.builtin.copy:
        src: "{{ bundle }}/nodes/{{ inventory_hostname }}.tar"
        dest: "{{ work }}.tar"
        mode: "0644"

    - name: Start every node's job at once
      ansible.builtin.shell: >-
        rm -rf {{ work }} && mkdir -p {{ work }} &&
        tar -xf {{ work }}.tar -C {{ work }} && rm -f {{ work }}.tar &&
        sh {{ work }}/{{ inventory_hostname }}.sh 2>&1; rm -rf {{ work }}
      async: 1800
      poll: 0
      register: job

    - name: Wait for the job
      ansible.builtin.async_status:
        jid: "{{ job.ansible_job_id }}"
      register: done
      until: done.finished
      retries: 1800
      delay: 1

    - name: Keep every node's output on the bastion, in one file
      ansible.builtin.copy:
        content: "{{ dict(ansible_play_hosts | zip(ansible_play_hosts
          | map('extract', hostvars, ['done', 'stdout']))) | to_json }}"
        dest: "{{ bundle }}/out/out.json"
        mode: "0644"
      delegate_to: localhost
      run_once: true

    - name: Drop the async result on the node
      ansible.builtin.async_status:
        jid: "{{ job.ansible_job_id }}"
        mode: cleanup
